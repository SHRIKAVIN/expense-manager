<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-light.svg" data-app-favicon />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-title" content="Expenses" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      Safari captures this icon once, when the user taps "Add to Home Screen",
      and ignores `media` variants — so a theme-swapped tile could never follow
      the device afterwards. The artwork is transparent and flat instead, which
      lets iOS draw its own light / dark / tinted backdrop behind the glyph and
      keep the installed icon in step with the system appearance.
    -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-adaptive.png" />
    <title>Expense Manager</title>
    <script>
      // Persist theme before first paint to avoid a flash of the wrong theme (§5.5).
      // The resolved theme is recomputed per-user after auth; this is the pre-auth guard.
      (function () {
        try {
          var pref = localStorage.getItem("em.theme.lastResolved");
          if (pref !== "light" && pref !== "dark") {
            pref = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          document.documentElement.setAttribute("data-theme", pref);
          var themeMeta = document.querySelector('meta[name="theme-color"]');
          if (themeMeta) themeMeta.setAttribute("content", pref === "dark" ? "#1d1d1f" : "#ffffff");
          var faviconPath = pref === "dark" ? "/favicon-dark.svg" : "/favicon-light.svg";
          var appFavicon = document.querySelector('link[rel="icon"][data-app-favicon]');
          if (appFavicon) appFavicon.setAttribute("href", faviconPath);
        } catch (e) {
          /* no-op */
        }
      })();
    </script>
    <script>
      // iOS "Add to Home Screen" does not always match (display-mode: standalone).
      // Tag <html> early so PWA height fills apply before first paint.
      (function () {
        try {
          var root = document.documentElement;
          var ua = navigator.userAgent || "";
          var ios =
            /iPhone|iPad|iPod/.test(ua) ||
            (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
          if (ios) root.classList.add("ios");
          var standalone =
            window.matchMedia("(display-mode: standalone)").matches ||
            ("standalone" in navigator && navigator.standalone);
          if (standalone) root.classList.add("pwa-standalone");
        } catch (e) {
          /* no-op */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
